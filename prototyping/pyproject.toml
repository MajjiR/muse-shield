[project]
name = "privacy-engine"
version = "0.1.0"
description = "Local-first privacy layer: a small on-device Llama masks PII and confidential context before anything reaches a cloud LLM."
requires-python = ">=3.10"
dependencies = [
  "cryptography>=42",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "httpx>=0.27",
  "pydantic>=2.6",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
lora = ["torch", "transformers>=4.45", "peft>=0.12", "datasets", "accelerate"]

[project.scripts]
privacy-engine = "privacy_engine.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["privacy_engine*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
