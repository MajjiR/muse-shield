[project]
name = "muse-shield"
version = "0.0.1"
description = "Privacy gateway for Meta's Muse models: mask sensitive data before it reaches the model, restore it locally."
license = "AGPL-3.0-or-later"
requires-python = ">=3.10"
dependencies = [
  "cryptography>=42",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "httpx>=0.27",
  "pydantic>=2.6",
]

[project.optional-dependencies]
# PDF, Word and PowerPoint masking. PyMuPDF is AGPL-3.0, which is why the project is too.
documents = ["pymupdf==2.1", "lxml==6.1.3", "python-docx==1.2.0", "python-pptx==1.0.2"]
dev = ["pytest>=8", "muse-shield[documents]"]

[build-system]
requires = ["setuptools>=77"]  # SPDX license string
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["muse_shield*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
