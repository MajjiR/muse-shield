[project]
name = "muse-shield"
version = "0.0.1"
description = "Privacy gateway for Meta's Muse models: mask sensitive data before it reaches the model, restore it locally."
license = "AGPL-3.0-or-later"
requires-python = ">=3.10"
dependencies = [
  "cryptography>=42",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "httpx>=0.27",
  "pydantic>=2.6",
  "pillow>=10.1",
]

[project.optional-dependencies]
# PDF, Word and PowerPoint masking. PyMuPDF is AGPL-3.0, which is why the project is too. 2.0 and 2.1
# shift the text after a redacted word left by one glyph (the fill then covers it), so stay on 1.28.
documents = ["pymupdf==1.28.2", "lxml==6.1.3", "python-docx==1.2.0", "python-pptx==1.0.2"]
# Real accounts from the app's Connections screen (Google uses plain HTTPS; Telegram needs its client library).
connectors = ["telethon==1.45.0"]
dev = ["pytest>=8", "muse-shield[documents,connectors]"]

[build-system]
requires = ["setuptools>=77"]  # SPDX license string
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["muse_shield*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
