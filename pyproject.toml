[project]
name = "muse-shield"
version = "0.0.1"
description = "Privacy gateway for Meta's Muse models: mask sensitive data before it reaches the model, restore it locally."
requires-python = ">=3.10"
dependencies = [
  "cryptography>=42",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "httpx>=0.27",
  "pydantic>=2.6",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["muse_shield*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
