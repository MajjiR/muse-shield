<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Muse Shield composer</title>
  <link rel="stylesheet" href="frames.css">
</head>
<body class="composer-frame">
  <div class="box">
    <div id="pop" class="pop" hidden></div>
    <div class="editor">
      <div id="backdrop" class="backdrop" aria-hidden="true"></div>
      <textarea id="input" rows="1" placeholder="Ask Meta AI privately…" spellcheck="true"></textarea>
    </div>
    <div class="bar">
      <button id="shield" class="chip" type="button" title="Turn Muse Shield off for this page">🛡️ Muse Shield</button>
      <span id="status" class="status"></span>
      <span class="grow"></span>
      <span id="maskSel" class="masksel" hidden>
        Mask as
        <select id="maskType">
          <option>PERSON</option><option>ORG</option><option>PROJECT</option><option>AMOUNT</option><option>ID</option>
          <option>CONTACT</option><option>ADDRESS</option><option>LOCATION</option><option>DATE</option><option>SECRET</option>
          <option value="SENSITIVE_ATTRIBUTE">SENSITIVE</option>
        </select>
        <button id="maskBtn" type="button" class="chip chip--accent">Mask</button>
      </span>
      <button id="send" class="send" type="button" title="Mask and send (Enter)" aria-label="Mask and send">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M12 4.5a1 1 0 0 1 .7.3l6 6a1 1 0 1 1-1.4 1.4L13 7.9V19a1 1 0 1 1-2 0V7.9l-4.3 4.3a1 1 0 1 1-1.4-1.4l6-6a1 1 0 0 1 .7-.3z"/></svg>
      </button>
    </div>
  </div>
  <script src="shared.js"></script>
  <script src="composer.js"></script>
</body>
</html>
